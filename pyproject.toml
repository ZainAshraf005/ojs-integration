[project]
name = "sch-archive"
version = "0.1.0"
description = "Persistent identifiers and PDF backup for OJS journals"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "arq>=0.26",
    "jinja2>=3.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.18",
    "cryptography>=43",
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
