# Local development:  docker compose up -d db redis   (then run the app with uv)
# Production (VPS):   docker compose up -d --build     (everything, behind Caddy with automatic HTTPS)

x-app: &app
  build: .
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://archive:${POSTGRES_PASSWORD:-archive}@db:5432/archive
    REDIS_URL: redis://redis:6379/0
    STORAGE_DIR: /srv/data/files
  volumes:
    - files:/srv/data/files
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_started }

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: archive
      POSTGRES_USER: archive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-archive}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"  # localhost only, never public
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archive -d archive"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"

  app:
    <<: *app

  worker:
    <<: *app
    command: ["arq", "app.worker.main.WorkerSettings"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]

volumes:
  pgdata:
  redisdata:
  files:
  caddy_data:
